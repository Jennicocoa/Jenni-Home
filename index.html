<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jenni's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #faf9f7;
    --bg2: #f2f0ec;
    --bg3: #e8e5df;
    --text: #1a1916;
    --text2: #6b6860;
    --text3: #a09d97;
    --border: rgba(26,25,22,0.1);
    --border2: rgba(26,25,22,0.18);
    --pink: #c9506a;
    --pink-bg: #fdf0f2;
    --blue: #3a6fa8;
    --blue-bg: #eef3fa;
    --amber: #b06a1a;
    --amber-bg: #fdf4e8;
    --green: #2a7a52;
    --green-bg: #edf7f2;
    --purple: #6b52a8;
    --purple-bg: #f3f0fb;
    --teal: #1d7a8a;
    --coral: #c05a38;
    --coral-bg: #fdf1ed;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 4rem;
  }
  h1, h2, h3 { font-family: 'DM Serif Display', serif; font-weight: 400; }

  /* LAYOUT */
  .page { max-width: 680px; margin: 0 auto; padding: 2rem 1.25rem; }

  /* HEADER */
  .header { margin-bottom: 2.5rem; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .greeting { font-family: 'DM Serif Display', serif; font-size: 2rem; font-weight: 400; line-height: 1.2; color: var(--text); }
  .greeting em { font-style: italic; color: var(--pink); }
  .dateline { font-size: 0.8rem; color: var(--text3); margin-top: 0.35rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .theme-toggle { background: none; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: var(--text2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 4px; }

  /* SECTION */
  .section { margin-bottom: 2.25rem; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .section-label { font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); }

  /* FOCUS */
  .focus-empty { font-size: 0.9rem; color: var(--text3); padding: 0.5rem 0; font-style: italic; }
  .focus-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    transition: box-shadow 0.15s;
  }
  .focus-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .fcheck {
    width: 20px; height: 20px;
    border: 1.5px solid var(--border2);
    border-radius: 50%;
    flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
  }
  .fcheck.done { background: var(--green); border-color: var(--green); }
  .fcheck.done::after { content: '✓'; font-size: 11px; color: white; }
  .focus-body { flex: 1; }
  .focus-title { font-size: 0.95rem; color: var(--text); line-height: 1.4; }
  .focus-title.done { text-decoration: line-through; color: var(--text3); }
  .focus-due { font-size: 0.75rem; color: var(--text3); margin-top: 3px; }
  .focus-due.urgent { color: var(--coral); font-weight: 500; }
  .cat-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-top: 3px; }

  /* EVENTS */
  .events-row { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .events-row::-webkit-scrollbar { display: none; }
  .event-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    min-width: 148px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .event-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent, var(--pink));
  }
  .event-num { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--text); line-height: 1; margin-bottom: 4px; }
  .event-unit { font-size: 0.7rem; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .event-name { font-size: 0.8rem; color: var(--text); line-height: 1.3; font-weight: 500; }
  .event-date-str { font-size: 0.7rem; color: var(--text3); margin-top: 3px; }

  /* TASKS */
  .tabs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 0.65rem; }
  .tab { font-size: 0.72rem; padding: 4px 10px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); font-family: 'DM Sans', sans-serif; transition: all 0.12s; }
  .tab:hover { background: var(--bg2); }
  .tab.active { background: var(--text); color: white; border-color: var(--text); }
  .tasks-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .task-row { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .task-row:last-child { border-bottom: none; }
  .task-row:hover { background: var(--bg); }
  .tcheck {
    width: 17px; height: 17px;
    border: 1.5px solid var(--border2);
    border-radius: 4px;
    flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
  }
  .tcheck.done { background: var(--green); border-color: var(--green); }
  .tcheck.done::after { content: '✓'; font-size: 10px; color: white; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 0.88rem; color: var(--text); line-height: 1.4; }
  .task-title.done { text-decoration: line-through; color: var(--text3); }
  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .task-due { font-size: 0.72rem; color: var(--text3); }
  .task-due.urgent { color: var(--coral); font-weight: 500; }
  .pin-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; padding: 2px 4px; flex-shrink: 0; line-height: 1; margin-top: 1px; transition: color 0.12s; }
  .pin-btn:hover { color: var(--pink); }
  .pin-btn.pinned { color: var(--pink); }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 13px; padding: 2px 4px; flex-shrink: 0; line-height: 1; margin-top: 2px; transition: color 0.12s; opacity: 0; }
  .task-row:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--coral); }
  .empty-state { font-size: 0.85rem; color: var(--text3); padding: 1.25rem; text-align: center; font-style: italic; }

  /* ADD ROW */
  .add-area { margin-top: 0.65rem; }
  .add-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .add-row input, .add-row select {
    font-size: 0.85rem;
    padding: 8px 10px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    background: white;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }
  .add-row input:focus, .add-row select:focus { border-color: var(--text2); }
  .add-row input.main { flex: 1; min-width: 160px; }
  .add-row input.date-in { width: 140px; }
  .add-row select { width: 130px; }
  .add-btn {
    padding: 8px 14px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    background: var(--text);
    color: white;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .add-btn:hover { opacity: 0.85; }
  .add-btn.secondary { background: transparent; color: var(--text); }

  /* ASPIRATIONAL */
  .asp-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .asp-row { display: flex; align-items: center; gap: 0.65rem; padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); }
  .asp-row:last-child { border-bottom: none; }
  .asp-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .asp-text { font-size: 0.88rem; color: var(--text2); flex: 1; font-style: italic; }
  .asp-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 13px; padding: 2px; opacity: 0; transition: opacity 0.12s, color 0.12s; }
  .asp-row:hover .asp-del { opacity: 1; }
  .asp-del:hover { color: var(--coral); }

  /* JOURNAL */
  .journal-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .journal-entry { padding: 1rem; border-bottom: 1px solid var(--border); }
  .journal-entry:last-child { border-bottom: none; }
  .journal-entry-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
  .journal-date { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em; }
  .journal-mood { font-size: 0.72rem; padding: 2px 8px; border-radius: 20px; }
  .journal-text { font-size: 0.88rem; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }
  .journal-write { padding: 1rem; border-bottom: 1px solid var(--border); }
  .journal-write textarea {
    width: 100%;
    font-size: 0.88rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    line-height: 1.6;
    min-height: 80px;
  }
  .journal-write textarea::placeholder { color: var(--text3); font-style: italic; }
  .journal-footer { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; background: var(--bg); border-top: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .mood-row { display: flex; gap: 6px; }
  .mood-btn { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 0.72rem; cursor: pointer; color: var(--text2); font-family: 'DM Sans', sans-serif; transition: all 0.12s; }
  .mood-btn:hover, .mood-btn.active { background: var(--text); color: white; border-color: var(--text); }
  .save-entry-btn { padding: 6px 14px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-size: 0.82rem; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .save-entry-btn:hover { opacity: 0.85; }
  .notes-area {
    width: 100%; min-height: 120px;
    font-size: 0.88rem; font-family: 'DM Sans', sans-serif;
    color: var(--text); border: none; outline: none;
    resize: none; background: transparent;
    line-height: 1.7; padding: 1rem;
  }
  .notes-area::placeholder { color: var(--text3); font-style: italic; }
  .notes-saved { font-size: 0.75rem; color: var(--text3); padding: 0.5rem 1rem; border-top: 1px solid var(--border); font-style: italic; }

  /* DARK MODE */
  body.dark {
    --bg: #141412; --bg2: #1e1d1a; --bg3: #272521;
    --text: #f0ede8; --text2: #9e9b94; --text3: #6b6860;
    --border: rgba(240,237,232,0.09); --border2: rgba(240,237,232,0.15);
  }
  body.dark .focus-card, body.dark .event-card, body.dark .tasks-card,
  body.dark .asp-card, body.dark .journal-card, body.dark .add-row input,
  body.dark .add-row select { background: #1e1d1a; }
  body.dark .task-row:hover, body.dark .asp-row:hover { background: #272521; }

  @media (max-width: 500px) {
    .greeting { font-size: 1.6rem; }
    .add-row input.date-in { width: 120px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-top">
      <div>
        <div class="greeting" id="greeting">Good morning, <em>Jenni</em></div>
        <div class="dateline" id="dateline"></div>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">☾</button>
    </div>
  </div>

  <!-- TODAY'S FOCUS -->
  <div class="section">
    <div class="section-header">
      <div class="section-label">Today's focus</div>
      <div style="font-size:0.72rem;color:var(--text3);">Pin up to 3 tasks below ↓</div>
    </div>
    <div id="focus-list"></div>
    <div class="focus-empty" id="focus-empty" style="display:none;">No tasks pinned yet — pin up to 3 from your task list below.</div>
  </div>

  <!-- THINGS TO LOOK FORWARD TO -->
  <div class="section">
    <div class="section-header">
      <div class="section-label">Things to look forward to</div>
      <button class="add-btn secondary" id="add-event-toggle" style="font-size:0.72rem;padding:4px 10px;">+ Add</button>
    </div>
    <div class="events-row" id="events-row"></div>
    <div id="add-event-form" style="display:none;margin-top:0.65rem;">
      <div class="add-row">
        <input class="main" type="text" id="ev-name" placeholder="Event name..." />
        <input class="date-in" type="date" id="ev-date" />
        <button class="add-btn" id="ev-add-btn">Add</button>
      </div>
    </div>
  </div>

  <!-- TASKS -->
  <div class="section">
    <div class="section-label" style="margin-bottom:0.6rem;">Tasks</div>
    <div class="tabs" id="cat-tabs"></div>
    <div class="tasks-card" id="tasks-list"></div>
    <div class="add-area">
      <div class="add-row">
        <input class="main" type="text" id="task-input" placeholder="Add a task..." />
        <input class="date-in" type="date" id="task-date" />
        <select id="task-cat"></select>
        <button class="add-btn" id="task-add-btn">Add</button>
      </div>
    </div>
  </div>

  <!-- ASPIRATIONAL -->
  <div class="section">
    <div class="section-label" style="margin-bottom:0.6rem;">Someday / aspirational</div>
    <div class="asp-card" id="asp-list"></div>
    <div class="add-area">
      <div class="add-row">
        <input class="main" type="text" id="asp-input" placeholder="Add an idea or longer-term goal..." />
        <button class="add-btn" id="asp-add-btn">Add</button>
      </div>
    </div>
  </div>

  <!-- NOTES -->
  <div class="section">
    <div class="section-label" style="margin-bottom:0.6rem;">Notes</div>
    <div class="journal-card">
      <textarea class="notes-area" id="notes-area" placeholder="A space for anything on your mind — brain dumps, reminders, random thoughts..."></textarea>
      <div class="notes-saved" id="notes-saved"></div>
    </div>
  </div>

  <!-- JOURNAL -->
  <div class="section">
    <div class="section-label" style="margin-bottom:0.6rem;">Journal</div>
    <div class="journal-card">
      <div class="journal-write">
        <textarea id="journal-input" placeholder="How are you feeling today? What's on your mind..."></textarea>
      </div>
      <div class="journal-footer">
        <div class="mood-row" id="mood-row">
          <button class="mood-btn" data-mood="great">Great</button>
          <button class="mood-btn" data-mood="good">Good</button>
          <button class="mood-btn" data-mood="okay">Okay</button>
          <button class="mood-btn" data-mood="low">Low</button>
          <button class="mood-btn" data-mood="stressed">Stressed</button>
        </div>
        <button class="save-entry-btn" id="save-entry-btn">Save entry</button>
      </div>
      <div id="journal-entries"></div>
    </div>
  </div>

</div>

<script>
const CATS = [
  { id: 'bachelorette', label: 'Bachelorette', color: '#c9506a', bg: '#fdf0f2' },
  { id: 'work',         label: 'Work',         color: '#3a6fa8', bg: '#eef3fa' },
  { id: 'life',         label: 'Life admin',   color: '#b06a1a', bg: '#fdf4e8' },
  { id: 'health',       label: 'Health',       color: '#2a7a52', bg: '#edf7f2' },
  { id: 'relationship', label: 'Relationship', color: '#6b52a8', bg: '#f3f0fb' },
  { id: 'finance',      label: 'Finance',      color: '#1d7a8a', bg: '#edf6f8' },
  { id: 'travel',       label: 'Travel',       color: '#c05a38', bg: '#fdf1ed' },
];
const CAT_MAP = {};
CATS.forEach(c => CAT_MAP[c.id] = c);

const EVENT_COLORS = ['#c9506a','#6b52a8','#3a6fa8','#2a7a52','#c05a38','#b06a1a'];

const MOOD_COLORS = {
  great: { bg: '#edf7f2', color: '#2a7a52' },
  good:  { bg: '#eef3fa', color: '#3a6fa8' },
  okay:  { bg: '#fdf4e8', color: '#b06a1a' },
  low:   { bg: '#f3f0fb', color: '#6b52a8' },
  stressed: { bg: '#fdf1ed', color: '#c05a38' },
};

const DEFAULT_TASKS = [
  { id: 't1', text: 'Submit protein menu to Sookie (Love Hibachi)', cat: 'bachelorette', due: '2025-05-23', done: false, pinned: true },
  { id: 't2', text: 'Confirm dietary restrictions for 2 guests', cat: 'bachelorette', due: '2025-05-23', done: false, pinned: true },
  { id: 't3', text: 'Plan a date night with Leland', cat: 'relationship', due: '', done: false, pinned: true },
  { id: 't4', text: 'Buy gym bag + pack it ready to go', cat: 'health', due: '', done: false, pinned: false },
  { id: 't5', text: 'Research house cleaner options', cat: 'life', due: '', done: false, pinned: false },
  { id: 't6', text: 'Send birthday card', cat: 'life', due: '', done: false, pinned: false },
  { id: 't7', text: 'Review personal finances / savings check-in', cat: 'finance', due: '', done: false, pinned: false },
  { id: 't8', text: 'Book accommodation for end of June trip', cat: 'travel', due: '2025-06-01', done: false, pinned: false },
];

const DEFAULT_EVENTS = [
  { id: 'e1', label: "Des's bachelorette", date: '2025-05-24', colorIdx: 0 },
  { id: 'e2', label: "Maddie's bachelorette", date: '2025-06-14', colorIdx: 1 },
  { id: 'e3', label: "Des's wedding", date: '2025-06-28', colorIdx: 2 },
];

const DEFAULT_ASP = [
  { id: 'a1', text: 'Post TikToks consistently' },
  { id: 'a2', text: 'Meal prep plan for the week' },
  { id: 'a3', text: 'Build out an agent for meal prep planning' },
  { id: 'a4', text: 'Look into sauna membership options' },
];

let tasks = [], events = [], aspirations = [], journalEntries = [];
let activeTab = 'all', selectedMood = '';
let notesSaveTimer = null;

// STORAGE
function ls(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
function ls_set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

function loadAll() {
  tasks       = ls('jd_tasks')    || [...DEFAULT_TASKS];
  events      = ls('jd_events')   || [...DEFAULT_EVENTS];
  aspirations = ls('jd_asp')      || [...DEFAULT_ASP];
  journalEntries = ls('jd_journal') || [];
  const notes = ls('jd_notes');
  if (notes) document.getElementById('notes-area').value = notes;
  const dark = ls('jd_dark');
  if (dark) document.body.classList.add('dark');
}

// UTILS
function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
}
function formatDue(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '';
  if (d < 0) return 'Overdue';
  if (d === 0) return 'Due today';
  if (d === 1) return 'Due tomorrow';
  if (d <= 7) return 'Due in ' + d + ' days';
  return 'Due ' + new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function isUrgent(dateStr) { const d = daysUntil(dateStr); return d !== null && d <= 3; }
function uid() { return '_' + Math.random().toString(36).slice(2,9); }

// HEADER
function renderHeader() {
  const h = new Date().getHours();
  const g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').innerHTML = g + ', <em>Jenni</em>';
  document.getElementById('dateline').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

// FOCUS
function renderFocus() {
  const pinned = tasks.filter(t => t.pinned && !t.done);
  const el = document.getElementById('focus-list');
  const empty = document.getElementById('focus-empty');
  el.innerHTML = '';
  if (!pinned.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';
  pinned.forEach(t => {
    const cat = CAT_MAP[t.cat];
    const div = document.createElement('div');
    div.className = 'focus-card';
    div.innerHTML = `
      <div class="fcheck ${t.done?'done':''}" data-id="${t.id}"></div>
      <div class="focus-body">
        <div class="focus-title ${t.done?'done':''}">${t.text}</div>
        ${t.due ? `<div class="focus-due ${isUrgent(t.due)?'urgent':''}">${formatDue(t.due)}</div>` : ''}
      </div>
      ${cat ? `<span class="cat-pill" style="background:${cat.bg};color:${cat.color};">${cat.label}</span>` : ''}
    `;
    div.querySelector('.fcheck').onclick = () => toggleDone(t.id);
    el.appendChild(div);
  });
}

// EVENTS
function renderEvents() {
  const el = document.getElementById('events-row');
  el.innerHTML = '';
  [...events].sort((a,b) => new Date(a.date)-new Date(b.date)).forEach(ev => {
    const d = daysUntil(ev.date);
    const color = EVENT_COLORS[ev.colorIdx % EVENT_COLORS.length];
    const card = document.createElement('div');
    card.className = 'event-card';
    card.style.setProperty('--accent', color);
    card.innerHTML = `
      <div class="event-num">${d <= 0 ? '🎉' : d}</div>
      <div class="event-unit">${d <= 0 ? 'today' : d === 1 ? 'day away' : 'days away'}</div>
      <div class="event-name">${ev.label}</div>
      <div class="event-date-str">${new Date(ev.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
    `;
    el.appendChild(card);
  });
}

// TABS
function renderTabs() {
  const el = document.getElementById('cat-tabs');
  el.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'tab' + (activeTab==='all'?' active':'');
  all.textContent = 'All ' + tasks.filter(t=>!t.done).length;
  all.onclick = () => { activeTab='all'; renderTabs(); renderTasks(); };
  el.appendChild(all);
  CATS.forEach(c => {
    const count = tasks.filter(t => t.cat===c.id && !t.done).length;
    if (!count) return;
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeTab===c.id?' active':'');
    btn.textContent = c.label + ' ' + count;
    btn.onclick = () => { activeTab=c.id; renderTabs(); renderTasks(); };
    el.appendChild(btn);
  });
}

// TASKS
function renderTasks() {
  const el = document.getElementById('tasks-list');
  const filtered = (activeTab==='all' ? tasks : tasks.filter(t=>t.cat===activeTab))
    .sort((a,b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.due && b.due) return new Date(a.due)-new Date(b.due);
      if (a.due) return -1; if (b.due) return 1; return 0;
    });
  if (!filtered.length) { el.innerHTML = '<div class="empty-state">No tasks here yet</div>'; return; }
  el.innerHTML = '';
  filtered.forEach(t => {
    const cat = CAT_MAP[t.cat];
    const pinCount = tasks.filter(x=>x.pinned&&!x.done).length;
    const canPin = t.pinned || pinCount < 3;
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `
      <div class="tcheck ${t.done?'done':''}" data-id="${t.id}"></div>
      <div class="task-body">
        <div class="task-title ${t.done?'done':''}">${t.text}</div>
        <div class="task-meta">
          ${t.due ? `<span class="task-due ${isUrgent(t.due)?'urgent':''}">${formatDue(t.due)}</span>` : ''}
          ${cat ? `<span class="cat-pill" style="background:${cat.bg};color:${cat.color};">${cat.label}</span>` : ''}
        </div>
      </div>
      <button class="pin-btn ${t.pinned?'pinned':''}" data-id="${t.id}" title="${t.pinned?'Unpin':'Pin to focus'}" ${!canPin&&!t.pinned?'disabled':''}>
        ${t.pinned ? '📌' : '📍'}
      </button>
      <button class="del-btn" data-id="${t.id}" title="Delete">✕</button>
    `;
    row.querySelector('.tcheck').onclick = () => toggleDone(t.id);
    row.querySelector('.pin-btn').onclick = () => togglePin(t.id);
    row.querySelector('.del-btn').onclick = () => deleteTask(t.id);
    el.appendChild(row);
  });
}

// ASPIRATIONAL
function renderAsp() {
  const el = document.getElementById('asp-list');
  if (!aspirations.length) { el.innerHTML = '<div class="empty-state">Add ideas and goals you want to work toward someday</div>'; return; }
  el.innerHTML = '';
  aspirations.forEach(a => {
    const row = document.createElement('div');
    row.className = 'asp-row';
    row.innerHTML = `<div class="asp-dot"></div><div class="asp-text">${a.text}</div><button class="asp-del" data-id="${a.id}">✕</button>`;
    row.querySelector('.asp-del').onclick = () => { aspirations = aspirations.filter(x=>x.id!==a.id); ls_set('jd_asp', aspirations); renderAsp(); };
    el.appendChild(row);
  });
}

// JOURNAL
function renderJournal() {
  const el = document.getElementById('journal-entries');
  el.innerHTML = '';
  [...journalEntries].reverse().forEach(entry => {
    const mc = MOOD_COLORS[entry.mood] || {};
    const div = document.createElement('div');
    div.className = 'journal-entry';
    div.innerHTML = `
      <div class="journal-entry-header">
        <div class="journal-date">${new Date(entry.ts).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
        ${entry.mood ? `<span class="journal-mood" style="background:${mc.bg||'#f2f0ec'};color:${mc.color||'#6b6860'};">${entry.mood}</span>` : ''}
      </div>
      <div class="journal-text">${entry.text}</div>
    `;
    el.appendChild(div);
  });
}

// ACTIONS
function toggleDone(id) {
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  t.done = !t.done;
  if (t.done) t.pinned = false;
  ls_set('jd_tasks', tasks);
  renderAll();
}
function togglePin(id) {
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  const pinCount = tasks.filter(x=>x.pinned&&!x.done).length;
  if (!t.pinned && pinCount >= 3) return;
  t.pinned = !t.pinned;
  ls_set('jd_tasks', tasks);
  renderAll();
}
function deleteTask(id) {
  tasks = tasks.filter(t=>t.id!==id);
  ls_set('jd_tasks', tasks);
  renderAll();
}

function renderAll() {
  renderFocus(); renderEvents(); renderTabs(); renderTasks(); renderAsp(); renderJournal();
}

// SETUP SELECTS
function setupCatSelect() {
  const sel = document.getElementById('task-cat');
  CATS.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.label;
    sel.appendChild(opt);
  });
}

// ADD TASK
document.getElementById('task-add-btn').onclick = () => {
  const text = document.getElementById('task-input').value.trim();
  if (!text) return;
  tasks.push({ id: uid(), text, cat: document.getElementById('task-cat').value, due: document.getElementById('task-date').value, done: false, pinned: false });
  ls_set('jd_tasks', tasks);
  document.getElementById('task-input').value = '';
  document.getElementById('task-date').value = '';
  renderAll();
};
document.getElementById('task-input').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('task-add-btn').click(); });

// ADD EVENT
document.getElementById('add-event-toggle').onclick = () => {
  const f = document.getElementById('add-event-form');
  f.style.display = f.style.display === 'none' ? '' : 'none';
};
document.getElementById('ev-add-btn').onclick = () => {
  const name = document.getElementById('ev-name').value.trim();
  const date = document.getElementById('ev-date').value;
  if (!name || !date) return;
  events.push({ id: uid(), label: name, date, colorIdx: events.length % EVENT_COLORS.length });
  ls_set('jd_events', events);
  document.getElementById('ev-name').value = '';
  document.getElementById('ev-date').value = '';
  document.getElementById('add-event-form').style.display = 'none';
  renderEvents();
};

// ADD ASPIRATIONAL
document.getElementById('asp-add-btn').onclick = () => {
  const text = document.getElementById('asp-input').value.trim();
  if (!text) return;
  aspirations.push({ id: uid(), text });
  ls_set('jd_asp', aspirations);
  document.getElementById('asp-input').value = '';
  renderAsp();
};
document.getElementById('asp-input').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('asp-add-btn').click(); });

// NOTES autosave
document.getElementById('notes-area').addEventListener('input', () => {
  clearTimeout(notesSaveTimer);
  document.getElementById('notes-saved').textContent = 'Saving...';
  notesSaveTimer = setTimeout(() => {
    ls_set('jd_notes', document.getElementById('notes-area').value);
    document.getElementById('notes-saved').textContent = 'Saved ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }, 800);
});

// MOOD
document.getElementById('mood-row').onclick = e => {
  const btn = e.target.closest('.mood-btn');
  if (!btn) return;
  selectedMood = btn.dataset.mood;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.toggle('active', b.dataset.mood===selectedMood));
};

// JOURNAL SAVE
document.getElementById('save-entry-btn').onclick = () => {
  const text = document.getElementById('journal-input').value.trim();
  if (!text) return;
  journalEntries.push({ id: uid(), text, mood: selectedMood, ts: Date.now() });
  ls_set('jd_journal', journalEntries);
  document.getElementById('journal-input').value = '';
  selectedMood = '';
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  renderJournal();
};

// DARK MODE
document.getElementById('theme-toggle').onclick = () => {
  document.body.classList.toggle('dark');
  ls_set('jd_dark', document.body.classList.contains('dark'));
};

// INIT
loadAll();
setupCatSelect();
renderHeader();
renderAll();
</script>
</body>
</html>
